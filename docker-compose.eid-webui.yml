# EID record-only Hermes WebUI deployment (spec 009)
#
# QUICK START:
#   cp .env.eid-webui.example .env
#   # edit .env — set HERMES_WEBUI_GATEWAY_API_KEY (same as Agent API_SERVER_KEY)
#   docker compose -f docker-compose.eid-webui.yml up -d --build
#
# Verify:
#   curl -i http://127.0.0.1:8787/health
#   curl -i http://127.0.0.1:8787/api/health/agent
#
# EID embeds this WebUI at /assistant/chatbot?record_id=<id> via eid-web nginx
# reverse proxy, or directly at http://<host>:8787/chatbot?record_id=<id>.

services:
  hermes-webui:
    image: hermes-webui-eid:latest
    container_name: hermes-webui-eid
    ports:
      - "8787:8787"
    extra_hosts:
      # Linux: reach Gateway on the Docker host via host.docker.internal
      - "host.docker.internal:host-gateway"
    volumes:
      - hermes-webui-home:/home/hermeswebui/.hermes
      - hermes-webui-venv:/app/venv
      - hermes-webui-uv-cache:/uv_cache
      - ${HERMES_WORKSPACE:-./workspace}:/workspace
    env_file:
      - .env.production
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui

      # EID record-only integration (spec 008)
      - HERMES_WEBUI_EID_RECORD_CONTEXT=1
      - HERMES_WEBUI_EMBED_ALLOWED_ORIGIN=${HERMES_WEBUI_EMBED_ALLOWED_ORIGIN:-http://192.168.208.23:8080}

      # Remote Hermes Agent Gateway (spec 009)
      - HERMES_WEBUI_CHAT_BACKEND=gateway
      - HERMES_WEBUI_GATEWAY_BASE_URL=${HERMES_WEBUI_GATEWAY_BASE_URL:-http://192.168.208.23:8642}
      - HERMES_WEBUI_GATEWAY_API_KEY=${HERMES_WEBUI_GATEWAY_API_KEY}

      - HERMES_WEBUI_GATEWAY_TRANSPORT=runs
      - HERMES_WORKSPACE=${HERMES_WORKSPACE:-./workspace}
      # Record-only EID embedding relies on eid-web entry control; do not expose
      # :8787 to the public internet without additional auth or reverse proxy.
      - HERMES_WEBUI_PASSWORD=

      # 或阿里云: https://mirrors.aliyun.com/pypi/simple/
      - UV_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    networks:
      - eid-2-net
networks:
  eid-2-net:
    external: true

volumes:
  hermes-webui-home:
  hermes-webui-venv:
  hermes-webui-uv-cache:
